<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación - Angel Armando</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="theme-toggle">
        <button id="darkModeBtn">
            <span class="icon">🌙</span> Modo Noche
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="profile-img">
                <img src="tu-foto.jpg" alt="Foto de Angel Armando">
            </div>
            <h1>Martinez Sanchez<br>Angel Armando</h1>
            <p class="title">Ingeniero de Software</p>
        </div>

        <div class="card-body">
            <h3>Mis Habilidades</h3>
            <div class="skills-container">
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Flutter</span>
                <span class="skill-tag">Node.js</span>
                <span class="skill-tag">MySQL</span>
            </div>

            <button class="contact-btn">Contactar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
